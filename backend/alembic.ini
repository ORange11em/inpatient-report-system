[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = standard

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic
propagate = 1

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = standard

[formatter_standard]
format = %(levelname)s [%(name)s] %(message)s
