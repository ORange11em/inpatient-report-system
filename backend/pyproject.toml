[project]
name = "inpatient-backend"
version = "0.1.0"
description = "Python API backend for the inpatient aggregate reporting system"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false
